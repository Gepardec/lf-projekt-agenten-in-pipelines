name: Juni CLI voa Python
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install junie-cli
        run: npm install -g junie-cli
      
      - name: Run Python Worker
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: python worker.py