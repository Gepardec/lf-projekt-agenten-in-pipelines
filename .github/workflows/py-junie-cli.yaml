name: Juni CLI via Python
on:
  schedule:
    - cron: '58 5 * * 1'
      timezone: "Europe/Vienna"

  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/py-junie-cli.yml
permissions:
  contents: write
  issues: write  
jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      #- name: Install junie-cli
      #  run: npm install -g jetbrains/junie-cli

      - name: Install junie-cli via Script
        run: curl -fsSL https://junie.jetbrains.com/install.sh | bash
      
      - name: Run Python Worker
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          JUNIE_API_KEY: ${{ secrets.JUNIE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python worker.py
      - name: Commit and push watermarks
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add watermarks.json
          
          if git diff --staged --quiet; then
            echo "skip Commit."
          else
            # Commit with [skip ci] 
            git commit -m "chore: update watermarks.json [skip ci]"
            git push
          fi
